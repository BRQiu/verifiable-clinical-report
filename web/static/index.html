<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>慢性病多源数据分析</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e222d; --line:#2a2f3d;
    --fg:#e6e9ef; --dim:#8b93a7; --accent:#4c9aff; --ok:#31c48d;
    --warn:#f0b429; --bad:#f0553d; --new:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;
         border-bottom:1px solid var(--line);background:var(--panel);
         position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:600}
  .badge{font-size:12px;padding:3px 9px;border-radius:20px;
         background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .badge.on{color:var(--ok);border-color:#1d4d3a}
  .layout{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 55px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  main{overflow-y:auto;padding:20px 24px}
  section{margin-bottom:22px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;
     color:var(--dim);margin:0 0 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .src{display:block;width:100%;text-align:left;background:var(--panel);
       border:1px solid var(--line);border-radius:9px;padding:11px 13px;
       margin-bottom:8px;cursor:pointer;color:var(--fg);font:inherit;
       transition:.15s}
  .src:hover{border-color:#3d4657}
  .src.active{border-color:var(--accent);background:#1b2532}
  .src .t{font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .src .d{font-size:12px;color:var(--dim);margin-top:3px}
  .plist{max-height:24vh;overflow-y:auto;margin-top:10px;
         border:1px solid var(--line);border-radius:9px}
  .p{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;
     font-size:13px;transition:.12s}
  .p:last-child{border-bottom:none}
  .p:hover{background:var(--panel2)}
  .p.active{background:#1b2532;border-left:3px solid var(--accent)}
  .p .id{font-weight:600}
  .p .m{color:var(--dim);font-size:12px}
  /* 患者数据清单 —— 用两行式列表而不是表格。
     330px 宽的侧栏塞 4 列会把「低密度脂蛋白胆固醇」「2020-01 ~ 2024-01」都挤到省略号，
     所以改成：第一行「指标 … 单位 次数」，第二行小字放时间范围。 */
  .inv{margin-top:8px;border:1px solid var(--line);
       border-radius:9px;background:var(--panel);overflow:hidden}
  .inv .row{padding:7px 11px;border-bottom:1px solid #222735}
  .inv .row:last-child{border-bottom:none}
  .inv .l1{display:flex;align-items:baseline;gap:8px}
  .inv .nm{font-weight:600;font-size:13px;flex:1;min-width:0}
  .inv .un{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .inv .ct{color:var(--fg);font-size:12px;font-variant-numeric:tabular-nums;
           white-space:nowrap;min-width:38px;text-align:right}
  .inv .l2{color:var(--dim);font-size:11px;margin-top:2px}
  select,textarea,input[type=text]{width:100%;background:var(--panel2);
    border:1px solid var(--line);color:var(--fg);border-radius:8px;
    padding:9px 11px;font:inherit;font-family:inherit}
  textarea{resize:vertical;min-height:62px}
  .chk{display:flex;align-items:center;gap:7px;margin:9px 0 3px;
       font-size:13px;cursor:pointer;user-select:none}
  .chk input{width:auto;accent-color:var(--accent);cursor:pointer}
  button.go{width:100%;margin-top:10px;padding:11px;border:none;border-radius:9px;
    background:var(--accent);color:#fff;font:600 14px inherit;cursor:pointer}
  button.go:disabled{background:#2c3444;color:var(--dim);cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .chart{background:#fff;border-radius:9px;overflow:auto;margin-bottom:12px;
         box-shadow:0 1px 4px #0003}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .chart{background:#fff;border-radius:9px;overflow:auto;margin-bottom:9px}
  .chart svg{display:block}
  .rep p{margin:0 0 7px;padding-left:14px;position:relative}
  .rep p::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;
    border-radius:50%;background:var(--dim)}
  .find{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);
        font-size:13px;align-items:flex-start}
  .find:last-child{border-bottom:none}
  .lv{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;
      font-weight:600}
  .lv.reject{background:#3d1d1a;color:var(--bad)}
  .lv.flag{background:#3d331a;color:var(--warn)}
  .lv.info{background:#1d2a3d;color:var(--accent)}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;
       background:var(--panel2);color:var(--dim);margin:0 4px 4px 0;
       border:1px solid var(--line)}
  .muted{color:var(--dim);font-size:12px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #ffffff44;
    border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;
    vertical-align:-2px;margin-right:7px}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>慢性病多源数据分析</h1>
  <span class="badge" id="bBackend">后端 —</span>
  <span class="badge" id="bSh">Synthetic Hospital —</span>
  <span class="badge">只做描述 · 不做临床评价</span>
</header>

<div class="layout">
  <aside>
    <section>
      <h2>1 · 选择数据</h2>
      <div id="srcList"></div>

      <div id="paneSh" class="hidden">
        <div class="muted" style="margin:10px 0 4px">点选患者，右侧列出他有哪些数据：</div>
        <div class="plist" id="plist"></div>
        <div id="pinfo"></div>
      </div>

      <div id="paneFiles" class="hidden">
        <div class="muted" style="margin:10px 0 4px">可多选（Ctrl / Shift）：</div>
        <select id="fileList" multiple size="7"></select>
      </div>
    </section>

    <section>
      <h2>2 · 提问</h2>
      <textarea id="q">看看这个患者最近几年的血糖、糖化血红蛋白和血压变化</textarea>
      <label class="chk"><input type="checkbox" id="merge" checked>
        同组指标合并到一张图</label>
      <div class="muted" style="margin:-2px 0 9px 22px;font-size:11.5px">
        收缩压/舒张压同属「血压」，血脂四项同属「血脂」——
        它们本来就是同一次测量的值，默认画在一起。</div>
      <label class="muted" style="display:block;margin:9px 0 3px">推理后端</label>
      <select id="backend">
        <option value="stub">stub —— 确定性桩，秒出（推荐先试）</option>
        <option value="local">local —— Qwen3-4B，约 20 秒</option>
        <option value="openai">openai —— 外部推理服务</option>
      </select>
      <button class="go" id="go">开始分析</button>
    </section>
  </aside>

  <main>
    <div id="empty" class="card muted">
      左侧选一个数据源，然后点「开始分析」。<br><br>
      <b>系统会做</b>：解析你的问题 → 预检数据 → 清洗 → 分析（含趋势）→ 选图 → 画图 → 生成报告 → 校验<br>
      <b>系统不会做</b>：任何临床评价。目标区间、异常判断都留给你。
    </div>

    <div id="out" class="hidden">
      <section><h2>图表</h2><div id="charts"></div></section>
      <section><h2>结论</h2><div class="card rep" id="report"></div></section>
      <section id="secWarn"></section>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let STATE = { source:null, patient:null, files:[] };

async function api(path, opt){
  const r = await fetch(path, opt);
  if(!r.ok){ let m; try{ m = (await r.json()).detail }catch(e){ m = r.statusText }
             throw new Error(m || ('HTTP '+r.status)); }
  return r.json();
}

(async function init(){
  const s = await api('/api/sources');
  $('#bBackend').textContent = '后端 ' + s.current_backend;
  $('#bBackend').classList.add('on');
  $('#backend').value = s.current_backend;

  const list = $('#srcList');
  list.innerHTML = '';
  s.sources.forEach(src=>{
    const b = document.createElement('button');
    b.className = 'src' + (src.available?'':' hidden');
    b.innerHTML = `<span class="t">${src.name}<span class="tag">${
      src.available?'可用':'未就绪'}</span></span><span class="d">${src.desc}</span>`;
    b.onclick = ()=>{
      document.querySelectorAll('.src').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      STATE.source = src.id; STATE.patient = null;
      $('#paneSh').classList.toggle('hidden', src.id!=='sh');
      $('#paneFiles').classList.toggle('hidden', src.id!=='files');
      if(src.id==='sh') loadPatients();
      if(src.id==='files'){
        const sel = $('#fileList'); sel.innerHTML='';
        s.files.forEach(f=>{
          const o=document.createElement('option');
          o.value=f.name; o.textContent=`${f.name}  (${f.size_kb} KB)`;
          sel.appendChild(o);
        });
      }
    };
    list.appendChild(b);
  });
  $('#bSh').textContent = 'Synthetic Hospital ' +
    (s.sources.find(x=>x.id==='sh').available ? '已就绪' : '未就绪');

  const first = list.querySelector('.src:not(.hidden)');
  if(first) first.click();
})();

async function loadPatients(){
  const d = await api('/api/patients?limit=80');
  const box = $('#plist'); box.innerHTML='';
  d.patients.forEach(p=>{
    const el = document.createElement('div');
    el.className='p';
    el.innerHTML = `<span class="id">患者 ${p.patient_id}</span>
      <span class="m">${p.sex} · ${p.age} 岁 · 就诊 ${p.n_encounters} 次 ·
      检验记录 ${p.n_lab_sections} 段</span>`;
    el.onclick = async ()=>{
      document.querySelectorAll('.p').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      STATE.patient = p.patient_id;
      $('#pinfo').innerHTML = '<div class="muted" style="margin-top:8px">正在整理…</div>';
      const pv = await api(`/api/patient/${p.patient_id}/preview`);
      renderInventory(pv);
    };
    box.appendChild(el);
  });
  const best = d.patients.find(p=>p.n_lab_sections>=6) || d.patients[0];
  if(best) box.querySelectorAll('.p')[d.patients.indexOf(best)].click();
}

function renderInventory(pv){
  const rows = pv.items.map(it=>`
    <div class="row">
      <div class="l1">
        <span class="nm">${esc(it.name)}</span>
        <span class="un">${esc(it.unit)}</span>
        <span class="ct">${it.n} 次</span>
      </div>
      <div class="l2">${it.first} ~ ${it.last}</div>
    </div>`).join('');
  $('#pinfo').innerHTML = `
    <div class="muted" style="margin:10px 0 2px">
      该患者共有 <b>${pv.n_metrics}</b> 项数据，合计 <b>${pv.n_records}</b> 条记录：
    </div>
    <div class="inv">${rows}</div>`;
}

$('#go').onclick = async ()=>{
  if(!STATE.source) return alert('先选数据源');
  if(STATE.source==='sh' && !STATE.patient) return alert('先选患者');
  if(STATE.source==='files'){
    STATE.files = [...$('#fileList').selectedOptions].map(o=>o.value);
    if(!STATE.files.length) return alert('先选文件');
  }
  const btn = $('#go');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>分析中…' +
    ( $('#backend').value==='local' ? '（本地模型约 20 秒）' : '');
  try{
    const res = await api('/api/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({source:STATE.source, patient_id:STATE.patient,
        files:STATE.files, question:$('#q').value, backend:$('#backend').value,
        merge_groups: $('#merge').checked})
    });
    render(res);
  }catch(e){ alert('失败：'+e.message); }
  finally{ btn.disabled=false; btn.textContent='开始分析'; }
};

function render(r){
  $('#empty').classList.add('hidden');
  $('#out').classList.remove('hidden');
  const v = r.verification;

  // ---- 图表 ----
  const svgs = Object.entries(r.charts||{});
  $('#charts').innerHTML = svgs.length
    ? svgs.map(([sid,svg])=>`<div class="chart">${svg}</div>`).join('')
    : '<div class="card muted">这个患者没有可画的数据。</div>';

  // ---- 结论 ----
  $('#report').innerHTML = r.sentences.length
    ? r.sentences.map(s=>`<p>${esc(s.resolved)}</p>`).join('')
    : '<p class="muted">（无）</p>';

  // ---- 只在有问题时才提示，正常就不打扰 ----
  const bad = v.rejects || [];
  const noData = (r.gaps||[]).filter(g=>g.reason.includes('没有任何数据'));
  let warn = '';
  if(bad.length){
    warn += `<div class="card" style="border-color:#4d2b26">
      <h2 style="color:var(--bad)">校验未通过 · ${bad.length} 项</h2>` +
      bad.map(f=>`<div class="find"><span class="lv reject">拒绝</span>
        <div><b>${f.check}</b> @${f.target}<br>
        <span class="muted">${esc(f.detail)}</span></div></div>`).join('') + `</div>`;
  }
  if(noData.length){
    warn += `<div class="card"><h2>缺少数据的指标</h2>` +
      noData.map(g=>`<div class="muted">· <b>${g.metric}</b> — ${g.reason}</div>`).join('') +
      `</div>`;
  }
  const shortWin = (r.requirements||[]).filter(x=>(x.flags||[])
      .includes('window_expanded_to_full_span'));
  if(shortWin.length){
    warn += `<div class="muted" style="margin-top:6px">
      未指定时间段，已按<b>全部可得历史</b>作窗口：
      ${shortWin.map(x=>`${x.metric} ${x.window_days}天`).join('、')}</div>`;
  }
  $('#secWarn').innerHTML = warn;
}

const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
</script>
</body>
</html>
